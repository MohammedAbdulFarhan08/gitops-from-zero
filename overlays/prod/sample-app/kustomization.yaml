apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/sample-app
  - pdb.yaml

labels:
  - pairs:
      app.kubernetes.io/environment: prod

replicas:
  - name: sample-app
    count: 3

# The CI pipeline rewrites this block with `kustomize edit set image`.
# It is the only line that changes on a normal deploy.
images:
  - name: sample-app
    newName: ghcr.io/stefanprodan/podinfo
    newTag: "6.14.1"

